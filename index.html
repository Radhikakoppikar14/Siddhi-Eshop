<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Restore a client-side route redirected here by GitHub Pages' 404 fallback.
      (function (location) {
        if (location.search[1] === "/") {
          const route = location.search
            .slice(1)
            .split("&")
            .map((part) => part.replace(/~and~/g, "&"))
            .join("?");
          window.history.replaceState(null, "", location.pathname.slice(0, -1) + route + location.hash);
        }
      })(window.location);
    </script>
    <title>Siddhi Eshop — Industrial Electrical Catalog & Quotation Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
